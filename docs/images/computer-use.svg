<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ZadLoop Computer Use control center</title>
  <desc id="desc">Illustrative mockup of the Computer Use panel with an expiring arm switch and desktop actions.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1119"/><stop offset="1" stop-color="#151b28"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202635"/><stop offset="1" stop-color="#171c27"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7185ff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="680" rx="26" fill="url(#page)"/>
  <g opacity=".13" stroke="#7f8baa"><path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/><path d="M200 0v680M400 0v680M600 0v680M800 0v680M1000 0v680"/></g>
  <rect x="250" y="52" width="700" height="560" rx="22" fill="url(#panel)" stroke="#3a4356" filter="url(#shadow)"/>
  <g transform="translate(286 84)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="42" height="42" rx="12" fill="#29324a"/>
    <g transform="translate(10 10)" fill="none" stroke="#8192ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="22" height="15" rx="2.5"/><path d="M8 21h6M11 15v6"/><path d="m13 6 5 2.2-2.2.8 1.2 2.6-1.8.8-1.2-2.6-1.8 1.5z"/></g>
    <text x="58" y="17" fill="#f1f3fa" font-size="18" font-weight="700">Computer Use</text>
    <text x="58" y="37" fill="#8791a5" font-size="12">Observable Windows control for your ZadLoop agent</text>
    <text x="626" y="23" fill="#7e889b" font-size="22">×</text>
  </g>
  <path d="M250 151h700" stroke="#343c4d"/>
  <g transform="translate(286 177)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="628" height="75" rx="13" fill="#171c27" stroke="#353d4e"/>
    <text x="17" y="29" fill="#f0f2f8" font-size="14" font-weight="650">Desktop control is ready</text>
    <text x="17" y="51" fill="#8791a5" font-size="11">The agent can operate the visible desktop until the timer expires.</text>
    <rect x="500" y="23" width="110" height="29" rx="15" fill="#183129"/>
    <circle cx="516" cy="37.5" r="4" fill="#43d58a"/>
    <text x="528" y="41" fill="#52dc96" font-size="10" font-weight="700">Armed · 28 min</text>
    <rect y="91" width="105" height="34" rx="9" fill="none" stroke="#914954"/>
    <text x="52.5" y="113" text-anchor="middle" fill="#f17a86" font-size="11" font-weight="650">Pause now</text>
    <text x="0" y="160" fill="#9ba5b8" font-size="11" font-weight="700" letter-spacing="1">AVAILABLE ACTIONS</text>
    <g transform="translate(0 177)" font-size="11">
      <g><rect width="198" height="61" rx="10" fill="#171c27" stroke="#343c4d"/><text x="13" y="25" fill="#eef1f8" font-weight="650">See</text><text x="13" y="44" fill="#818b9e" font-size="10">Fresh screenshot after every action</text></g>
      <g transform="translate(215)"><rect width="198" height="61" rx="10" fill="#171c27" stroke="#343c4d"/><text x="13" y="25" fill="#eef1f8" font-weight="650">Point</text><text x="13" y="44" fill="#818b9e" font-size="10">Move, click, double-click, right-click</text></g>
      <g transform="translate(430)"><rect width="198" height="61" rx="10" fill="#171c27" stroke="#343c4d"/><text x="13" y="25" fill="#eef1f8" font-weight="650">Drag</text><text x="13" y="44" fill="#818b9e" font-size="10">Smooth coordinate-based dragging</text></g>
      <g transform="translate(0 72)"><rect width="198" height="61" rx="10" fill="#171c27" stroke="#343c4d"/><text x="13" y="25" fill="#eef1f8" font-weight="650">Scroll</text><text x="13" y="44" fill="#818b9e" font-size="10">Vertical and horizontal scrolling</text></g>
      <g transform="translate(215 72)"><rect width="198" height="61" rx="10" fill="#171c27" stroke="#343c4d"/><text x="13" y="25" fill="#eef1f8" font-weight="650">Type</text><text x="13" y="44" fill="#818b9e" font-size="10">Unicode text without clipboard access</text></g>
      <g transform="translate(430 72)"><rect width="198" height="61" rx="10" fill="#171c27" stroke="#343c4d"/><text x="13" y="25" fill="#eef1f8" font-weight="650">Keys</text><text x="13" y="44" fill="#818b9e" font-size="10">Ctrl+L, Alt+Tab, Win+R, and more</text></g>
    </g>
    <rect y="333" width="628" height="58" rx="10" fill="#20283b" stroke="#303a55"/>
    <text x="14" y="356" fill="#eef1f8" font-size="10" font-weight="700">HOW TO USE IT</text>
    <text x="14" y="376" fill="#939db1" font-size="10">Arm control, then ask naturally. The agent observes before acting and checks every result.</text>
  </g>
  <g transform="translate(427 630)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="190" height="30" rx="15" fill="#1b2130" stroke="#343c4d"/>
    <g transform="translate(10 7)" fill="none" stroke="#98a2b5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" rx="2"/><path d="M6 16h6M9 12v4"/></g>
    <text x="39" y="20" fill="#aeb6c7" font-size="12">Computer</text>
    <circle cx="170" cy="15" r="3" fill="#43d58a"/>
  </g>
  <text x="638" y="651" fill="#626d80" font-family="Segoe UI,Arial,sans-serif" font-size="11">Illustrative mockup</text>
</svg>
