<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ZadLoop Remote Control setup panel</title>
  <desc id="desc">A dark modern panel showing Local browser, LAN, Quick Tunnel, and Custom domain connection modes.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11151d"/><stop offset="1" stop-color="#1a2130"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7298ff"/><stop offset="1" stop-color="#8a75ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".4"/></filter></defs>
  <rect width="1200" height="680" fill="url(#bg)"/><circle cx="180" cy="90" r="260" fill="#547cff" opacity=".08"/><circle cx="1080" cy="650" r="300" fill="#9a6cff" opacity=".07"/>
  <g filter="url(#shadow)"><rect x="180" y="58" width="840" height="564" rx="24" fill="#1b202a" stroke="#343c4b"/><path d="M180 146h840" stroke="#303744"/><rect x="212" y="84" width="42" height="42" rx="13" fill="#7298ff" opacity=".15"/><g fill="none" stroke="#8faaff" stroke-width="2" stroke-linecap="round"><rect x="221" y="94" width="24" height="16" rx="3"/><path d="M226 118h14m-7-8v8m-4-15c2.8-2.6 5.2-2.6 8 0"/></g>
    <g font-family="Inter,Segoe UI,sans-serif"><text x="270" y="102" fill="#f4f6fb" font-size="19" font-weight="700">Remote Control</text><text x="270" y="122" fill="#8f98a8" font-size="12">Your complete ZadLoop interface, securely available from another device</text><rect x="212" y="166" width="776" height="62" rx="13" fill="#151a22" stroke="#303744"/><text x="230" y="191" fill="#f2f5fa" font-size="14" font-weight="650">Remote access is off</text><text x="230" y="211" fill="#818b9b" font-size="11">Choose how you want to connect, then save and start.</text><rect x="922" y="184" width="44" height="22" rx="11" fill="#2b313d"/><text x="944" y="199" text-anchor="middle" fill="#aeb5c1" font-size="10" font-weight="700">OFF</text>
      <g><rect x="212" y="248" width="188" height="77" rx="12" fill="#1a2334" stroke="#7298ff"/><text x="226" y="272" fill="#f4f6fb" font-size="12" font-weight="700">Local browser</text><text x="226" y="294" fill="#8e99aa" font-size="10">Only this PC · password optional</text></g><g><rect x="408" y="248" width="188" height="77" rx="12" fill="#151a22" stroke="#303744"/><text x="422" y="272" fill="#f4f6fb" font-size="12" font-weight="700">LAN / IP</text><text x="422" y="294" fill="#8e99aa" font-size="10">Devices on your network</text></g><g><rect x="604" y="248" width="188" height="77" rx="12" fill="#151a22" stroke="#303744"/><text x="618" y="272" fill="#f4f6fb" font-size="12" font-weight="700">Quick Tunnel</text><text x="618" y="294" fill="#8e99aa" font-size="10">Temporary public URL</text></g><g><rect x="800" y="248" width="188" height="77" rx="12" fill="#151a22" stroke="#303744"/><text x="814" y="272" fill="#f4f6fb" font-size="12" font-weight="700">Custom domain</text><text x="814" y="294" fill="#8e99aa" font-size="10">Cloudflare named tunnel</text></g>
      <text x="212" y="356" fill="#b8bfca" font-size="11" font-weight="650">Listener port</text><rect x="212" y="366" width="376" height="40" rx="10" fill="#131820" stroke="#353e4d"/><text x="226" y="391" fill="#e5e9f0" font-size="12">48911</text><text x="612" y="356" fill="#b8bfca" font-size="11" font-weight="650">Signed-in session lifetime</text><rect x="612" y="366" width="376" height="40" rx="10" fill="#131820" stroke="#353e4d"/><text x="626" y="391" fill="#e5e9f0" font-size="12">8 hours</text>
      <text x="212" y="438" fill="#b8bfca" font-size="11" font-weight="650">Remote passphrase</text><rect x="212" y="448" width="776" height="40" rx="10" fill="#131820" stroke="#353e4d"/><text x="226" y="473" fill="#687284" font-size="12">At least 12 characters for LAN or Cloudflare</text><rect x="212" y="508" width="776" height="50" rx="11" fill="#1b2637"/><text x="228" y="529" fill="#e7ebf3" font-size="11" font-weight="700">Full control, contained securely.</text><text x="228" y="546" fill="#9da6b5" font-size="10">Complete ZadLoop UI · expiring sessions · revoke anytime · no raw shell endpoint</text><rect x="854" y="574" width="134" height="34" rx="10" fill="url(#accent)"/><text x="921" y="596" text-anchor="middle" fill="#08101f" font-size="11" font-weight="750">Save &amp; start</text>
    </g>
  </g>
</svg>
