<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Session Transfer</title><desc id="desc">Illustrative import and export modal for moving a complete ZadLoop chat.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1118"/><stop offset="1" stop-color="#171c27"/></linearGradient><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#657cff"/><stop offset="1" stop-color="#a879ff"/></linearGradient><filter id="sh"><feDropShadow dy="26" stdDeviation="34" flood-opacity=".5"/></filter></defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <rect x="120" y="74" width="1160" height="610" rx="26" fill="#1b202a" stroke="#343b4b" filter="url(#sh)"/>
  <g font-family="Segoe UI,Arial,sans-serif"><rect x="160" y="112" width="48" height="48" rx="14" fill="url(#mark)"/><rect x="173" y="123" width="22" height="25" rx="5" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M177 131h14m0 0-4-4m4 4-4 4M191 140h-14m0 0 4-4m-4 4 4 4" stroke="#fff" stroke-width="1.5" fill="none"/><text x="228" y="135" fill="#f5f6fb" font-size="25" font-weight="700">Session Transfer</text><text x="228" y="158" fill="#818ca0" font-size="14">Move a complete ZadLoop chat between computers</text><text x="1230" y="142" fill="#7b8495" font-size="28">×</text>
  <line x1="120" y1="187" x2="1280" y2="187" stroke="#313848"/>
  <rect x="160" y="216" width="1080" height="70" rx="14" fill="#171c25" stroke="#303747"/><text x="184" y="246" fill="#e4e7ef" font-size="15" font-weight="600">Project launch — complete working session</text><text x="184" y="269" fill="#737f93" font-family="Consolas,monospace" font-size="12">session-f3a12c10-7ad5-441f-ae9b-9fc3a77dfc77</text>
  <g transform="translate(160 316)"><rect width="522" height="235" rx="18" fill="#222834" stroke="#343d4f"/><circle cx="42" cy="42" r="18" fill="#2e3748"/><path d="M42 30v20m0 0-7-7m7 7 7-7M31 56v5h22v-5" stroke="#9eabc0" stroke-width="2" fill="none"/><text x="28" y="92" fill="#f0f2f7" font-size="20" font-weight="650">Export this chat</text><text x="28" y="124" fill="#8f9aaf" font-size="14">Downloads the raw session, title, settings, reasoning,</text><text x="28" y="147" fill="#8f9aaf" font-size="14">tool calls, subagents, files, and images.</text><rect x="28" y="177" width="466" height="38" rx="11" fill="#5668a7" stroke="#7b8dd0"/><text x="261" y="202" text-anchor="middle" fill="#f7f8ff" font-size="14" font-weight="600">Export complete chat</text></g>
  <g transform="translate(718 316)"><rect width="522" height="235" rx="18" fill="#222834" stroke="#343d4f"/><circle cx="42" cy="42" r="18" fill="#2e3748"/><path d="M42 53V33m0 0-7 7m7-7 7 7M31 57v5h22v-5" stroke="#9eabc0" stroke-width="2" fill="none"/><text x="28" y="92" fill="#f0f2f7" font-size="20" font-weight="650">Import a chat</text><text x="28" y="124" fill="#8f9aaf" font-size="14">Choose or drop a toolkit session ZIP. Compatible session</text><text x="28" y="147" fill="#8f9aaf" font-size="14">settings and the original identity are restored.</text><rect x="28" y="177" width="466" height="38" rx="11" fill="#2b3240" stroke="#414b60"/><text x="261" y="202" text-anchor="middle" fill="#e6e9f0" font-size="14" font-weight="600">Choose transfer file</text></g>
  <rect x="160" y="578" width="1080" height="60" rx="13" fill="#151a22"/><circle cx="184" cy="608" r="7" fill="#45c992"/><text x="203" y="603" fill="#b7c0d0" font-size="13" font-weight="600">Portable by design</text><text x="203" y="621" fill="#778297" font-size="12">Credentials, API keys, and global preferences never enter the archive.</text></g>
  <text x="700" y="728" text-anchor="middle" fill="#606a7d" font-family="Segoe UI,Arial,sans-serif" font-size="13">Illustrative mockup · import validates the archive before creating any session</text>
</svg>
